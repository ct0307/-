# A03 企业合同合规审查系统 · Docker Compose
# 快速启动：docker compose up -d
# 访问：http://localhost（前端）| http://localhost:8000/docs（后端 API 文档）

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a03_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=prod
      - DB_BACKEND=sqlite
    volumes:
      # 合同文件存储 + SQLite 数据库持久化
      - contract_storage:/app/storage
      # 注：embedding 模型已在镜像构建阶段烤入（见 backend/Dockerfile），
      # 运行时 HF_HUB_OFFLINE=1 直接读镜像内缓存，不再挂载 hf_cache volume
      # （空 volume 会遮蔽镜像里的模型，导致离线加载失败）。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/dashboard/summary"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: a03_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  contract_storage:
    driver: local
